<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Smart Waste - Encrypted</title>
<style>body{font-family:Arial;background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:20px}.nav{margin-bottom:20px}.nav a{margin:0 10px;text-decoration:none;font-weight:bold;color:#333}.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:90%;max-width:500px;text-align:center}#uploadArea{border:3px dashed #4CAF50;padding:40px;border-radius:10px;cursor:pointer;background:#f9fff9}#uploadArea:hover{background:#e8f5e9}.hidden{display:none}#previewImage{max-width:100%;max-height:300px;border-radius:10px;margin-bottom:15px}button{padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px}.success{border:2px solid #4CAF50;background:#e8f5e9;padding:15px;border-radius:10px}.error{border:2px solid red;background:#ffebee;padding:15px;border-radius:10px;color:red}</style>
</head><body>
<div class="nav"><a href="index.html">Dashboard</a> | <a href="history.html">History</a> | <a href="#" onclick="localStorage.clear();location.href='login.html'">Logout</a></div>
<div class="card"><h2>Upload Waste Image</h2>
<div id="uploadArea"><p style="font-size:40px">📤</p><p><b>Click to Upload</b></p><input type="file" id="fileInput" accept="image/*" class="hidden"></div>
<div id="preview" class="hidden"><img id="previewImage" src=""></div>
<div id="resultArea" class="hidden"></div>
<p style="font-size:12px;color:gray;margin-top:20px">Backend: <span id="backendStatus">Checking...</span></p></div>
<script>
const API_URL="http://127.0.0.1:5000";const uploadArea=document.getElementById('uploadArea');const fileInput=document.getElementById('fileInput');const preview=document.getElementById('preview');const previewImage=document.getElementById('previewImage');const resultArea=document.getElementById('resultArea');
fetch(`${API_URL}/`).then(r=>r.json()).then(d=>{document.getElementById('backendStatus').innerHTML="✅ Connected - Model Loaded";document.getElementById('backendStatus').style.color="green"}).catch(e=>{document.getElementById('backendStatus').innerHTML="❌ Not Connected - Run backend/app.py";document.getElementById('backendStatus').style.color="red"});
uploadArea.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',handleFile);
function handleFile(){const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{previewImage.src=e.target.result;preview.classList.remove('hidden');uploadArea.classList.add('hidden');resultArea.innerHTML="<p>🤖 AI Analyzing... Please wait</p>";resultArea.classList.remove('hidden');uploadImage(file)};reader.readAsDataURL(file)}
async function uploadImage(file){const form=new FormData();form.append('image',file);const uid=localStorage.getItem('user_id')||1;form.append('user_id',uid);try{const res=await fetch(`${API_URL}/predict`,{method:'POST',body:form});const data=await res.json();console.log(data);if(!res.ok){resultArea.innerHTML=`<div class="error">Error: ${data.error}<br><button onclick="location.reload()">Try Again</button></div>`;return}const result=data.plain_preview||data;resultArea.innerHTML=`<div class="success"><h2 style="color:green;margin:0">✅ ${result.predicted_class.toUpperCase()}</h2><p>Confidence: <b>${result.confidence}%</b></p><p>♻️ Tip: ${result.recycling_tip}</p>${data.encrypted?`<p style="font-size:11px;color:blue;word-break:break-all">🔒 Encrypted: YES<br>${data.data.substring(0,80)}...</p>`:''}<button onclick="location.reload()">Classify Another</button></div>`}catch(err){resultArea.innerHTML=`<div class="error"><b>Cannot connect!</b><br>${err.message}<br>Run: python backend/app.py<br><button onclick="location.reload()">Retry</button></div>`}}
</script></body></html>
