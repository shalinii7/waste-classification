<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Waste ♻️</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:linear-gradient(135deg,#0f5132,#198754);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
  .logo{text-align:center;font-size:48px}
  h1{text-align:center;color:#0f5132;font-size:26px;margin:8px 0 4px}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:20px}
  label{font-size:13px;font-weight:600;color:#333;display:block;margin:14px 0 6px}
  input{width:100%;padding:13px;border:2px solid #e9ecef;border-radius:12px;font-size:15px;outline:none}
  input:focus{border-color:#198754}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:#198754;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px}
  button:disabled{background:#aaa}
  .link{text-align:center;font-size:13px;margin-top:14px;color:#666}
  .link a{color:#198754;font-weight:600;text-decoration:none}
  #msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px}
  .demo{background:#f0f9f2;border-radius:10px;padding:10px;font-size:12px;color:#555;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">♻️</div>
  <h1>Welcome Back!</h1>
  <p class="sub">Login to Smart Waste Classifier</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="Enter username - e.g. shalini" autocomplete="username">

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">

  <button id="btn" onclick="doLogin()">Login →</button>
  <p id="msg"></p>

  <p class="link">New user? <a href="register.html">Create Account</a></p>

  <div class="demo">
    <b>For Demo:</b> Use your account<br>
    Username: <b>shalini</b> • Login and check History
  </div>
</div>

<script>
const API = "http://127.0.0.1:5000";

async function doLogin(){
  let username = document.getElementById('username').value.trim();
  let password = document.getElementById('password').value;
  let msg = document.getElementById('msg');
  let btn = document.getElementById('btn');

  if(!username || !password){
    msg.style.color = 'red';
    msg.textContent = 'Please enter username and password!';
    return;
  }

  btn.textContent = 'Logging in...';
  btn.disabled = true;
  msg.textContent = '';

  try{
    let res = await fetch(API + '/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username, password: password})
    });

    let data = await res.json();
    console.log('Login response:', data);

    // FIX: Backend may send username in different field - use typed username as fallback
    if(res.ok || data.success || data.user_id || data.token){
      let finalName = data.username || data.user || data.name || username;
      // Never save "undefined"
      if(!finalName || finalName === 'undefined') finalName = username;
      localStorage.setItem('user_id', data.user_id || data.id || '1');
      localStorage.setItem('username', finalName);
      localStorage.setItem('token', data.token || '');
      msg.style.color = 'green';
      msg.textContent = 'Login success! Hi, ' + finalName;
      setTimeout(()=>{ location.href = 'final2.html'; }, 500);
    } else {
      msg.style.color = 'red';
      msg.textContent = data.message || data.error || 'Login failed! Check username/password';
      btn.textContent = 'Login →';
      btn.disabled = false;
    }
  }catch(e){
    msg.style.color = 'red';
    msg.textContent = 'Backend not running! Start backend/app.py on port 5000';
    btn.textContent = 'Login →';
    btn.disabled = false;
  }
}

// Press Enter to login
document.getElementById('password').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
