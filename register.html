<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Waste ♻️</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:linear-gradient(135deg,#0f5132,#198754);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
  .logo{text-align:center;font-size:48px}
  h1{text-align:center;color:#0f5132;font-size:26px;margin:8px 0 4px}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:20px}
  label{font-size:13px;font-weight:600;color:#333;display:block;margin:14px 0 6px}
  input{width:100%;padding:13px;border:2px solid #e9ecef;border-radius:12px;font-size:15px;outline:none;display:block}
  input:focus{border-color:#198754}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:#198754;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;display:block}
  button:disabled{background:#aaa}
  .link{text-align:center;font-size:13px;margin-top:14px;color:#666}
  .link a{color:#198754;font-weight:600;text-decoration:none}
  #msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">♻️</div>
  <h1>Create Account</h1>
  <p class="sub">Join Smart Waste Classifier</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="Choose username - e.g. shalini">

  <label>Email</label>
  <input type="email" id="email" placeholder="Enter email">

  <label>Password</label>
  <input type="password" id="password" placeholder="Choose password">

  <button id="btn" onclick="doRegister()">Create Account →</button>
  <p id="msg"></p>

  <p class="link">Already have account? <a href="login.html">Login</a></p>
</div>

<script>
const API = "http://127.0.0.1:5000";
async function doRegister(){
  let username = document.getElementById('username').value.trim();
  let email = document.getElementById('email').value.trim();
  let password = document.getElementById('password').value;
  let msg = document.getElementById('msg');
  let btn = document.getElementById('btn');
  if(!username || !email || !password){
    msg.style.color='red'; msg.textContent='Fill all fields!'; return;
  }
  btn.textContent='Creating...'; btn.disabled=true;
  try{
    let res = await fetch(API + '/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: username, email: email, password: password})
    });
    let data = await res.json();
    if(res.ok || data.success || data.user_id){
      msg.style.color='green'; msg.textContent='Account created! Go to Login...';
      localStorage.setItem('username', username);
      setTimeout(()=>{ location.href='login.html'; }, 800);
    } else {
      msg.style.color='red'; msg.textContent = data.message || data.error || 'Register failed! User may exist';
      btn.textContent='Create Account →'; btn.disabled=false;
    }
  }catch(e){
    msg.style.color='red'; msg.textContent='Backend not running! Start backend/app.py';
    btn.textContent='Create Account →'; btn.disabled=false;
  }
}
</script>
</body>
</html>
