<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="container"><header><h1>📊 Dashboard</h1><p><a href="index.html">Classify</a> | <a href="history.html">History</a></p></header><div class="card"><h2>Total Classified: <span id="total">0</span></h2><div id="counts"></div></div></div>
<script>const API="http://127.0.0.1:5000"; const uid=localStorage.getItem('user_id'); if(!uid) window.location='login.html'; async function load(){const res=await fetch(API+"/api/stats/"+uid); const data=await res.json(); document.getElementById('total').innerText=data.total; let h=""; for(let k in data.counts){h+=`<p>${k}: ${data.counts[k]} items</p>`;} document.getElementById('counts').innerHTML=h;} load();</script></body></html>
